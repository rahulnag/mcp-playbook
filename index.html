<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Playbook</title>
    <meta name="description" content="Interactive docs and a live playground for MCP servers." />
    <meta name="theme-color" content="#111118" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (LinkedIn, X, Slack, …). `mcp-playbook build` fills these
         from the config; og:image becomes absolute when `siteUrl` is set. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MCP Playbook" />
    <meta property="og:description" content="Interactive docs and a live playground for MCP servers." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MCP Playbook" />
    <meta name="twitter:description" content="Interactive docs and a live playground for MCP servers." />
    <meta name="twitter:image" content="/og-image.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body {
        background: #080808;
        color: #e2e0d8;
        font-family: 'IBM Plex Mono', 'Fira Code', 'Cascadia Code', monospace;
        -webkit-font-smoothing: antialiased;
      }
      #root { display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
