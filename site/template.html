<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Playbook – Interactive docs and playground for MCP servers</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="theme-color" content="#0b0b10" />
  <meta name="color-scheme" content="dark" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{SITE_URL}}/" />
  <meta property="og:title" content="MCP Playbook" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:image" content="{{SITE_URL}}/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MCP Playbook" />
  <meta name="twitter:description" content="{{DESCRIPTION}}" />
  <meta name="twitter:image" content="{{SITE_URL}}/og-image.png" />

  <style>
    :root {
      --bg: #0b0b10;
      --surface: #12121a;
      --elevated: #191924;
      --border: #24242f;
      --text: #e6e4dc;
      --muted: #9a97a3;
      --dim: #6b6875;
      --accent: #7c74d8;
      --accent-hi: #a39cf0;
      --green: #5dcaa5;
      --mono: 'IBM Plex Mono', 'Fira Code', ui-monospace, Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --header-h: 56px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-padding-top: calc(var(--header-h) + 16px); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.7 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent-hi); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ───────────────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 20;
      height: var(--header-h);
      display: flex; align-items: center; gap: 24px;
      padding: 0 24px;
      background: rgba(11, 11, 16, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 700; font-family: var(--mono); }
    .brand:hover { text-decoration: none; }
    .brand img { width: 26px; height: 26px; }
    .version { font-size: 11px; color: var(--dim); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; font-weight: 400; }
    .nav { display: flex; gap: 20px; margin-left: auto; font-size: 14px; }
    .nav a { color: var(--muted); }
    .nav a:hover, .nav a.active { color: var(--text); text-decoration: none; }
    .nav .cta { color: var(--text); background: var(--accent); padding: 6px 14px; border-radius: 6px; }
    .nav .cta:hover { background: var(--accent-hi); color: #0b0b10; }
    .menu-btn { display: none; margin-left: auto; background: none; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer; }

    /* ── Hero ─────────────────────────────────────────── */
    .hero {
      text-align: center;
      padding: 72px 24px 56px;
      border-bottom: 1px solid var(--border);
      background: radial-gradient(ellipse at top, rgba(124, 116, 216, 0.14), transparent 60%);
    }
    .hero img { width: 72px; height: 72px; }
    .hero h1 { font: 700 44px/1.15 var(--mono); margin: 18px 0 12px; letter-spacing: -0.02em; }
    .hero p { font-size: 19px; color: var(--muted); max-width: 640px; margin: 0 auto 28px; }
    .install {
      display: inline-flex; align-items: center; gap: 14px;
      font: 15px var(--mono);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 10px 10px 18px; margin-bottom: 26px; max-width: 100%;
    }
    .install code { color: var(--green); white-space: nowrap; overflow-x: auto; }
    .install code::before { content: '$ '; color: var(--dim); }
    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { padding: 11px 22px; border-radius: 8px; font-weight: 600; font-size: 15px; border: 1px solid var(--border); color: var(--text); }
    .btn:hover { text-decoration: none; border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-hi); color: #0b0b10; }

    /* ── Layout ───────────────────────────────────────── */
    .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
    .toc {
      position: sticky; top: var(--header-h);
      height: calc(100vh - var(--header-h)); overflow-y: auto;
      padding: 32px 16px 32px 24px; border-right: 1px solid var(--border);
      font-size: 14px;
    }
    .toc-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 10px 10px; }
    .toc ul { list-style: none; margin: 0; padding: 0; }
    .toc a { display: block; padding: 4px 10px; color: var(--muted); border-left: 2px solid transparent; line-height: 1.45; }
    .toc a:hover { color: var(--text); text-decoration: none; }
    .toc a.active { color: var(--accent-hi); border-left-color: var(--accent); }
    .toc .l3 a { padding-left: 24px; font-size: 13px; }

    /* ── Docs content ─────────────────────────────────── */
    .content { padding: 40px 48px 96px; min-width: 0; }
    .content h2 { font-size: 28px; margin: 56px 0 16px; padding-top: 8px; border-top: 1px solid var(--border); }
    .content h2:first-child { margin-top: 0; border-top: 0; }
    .content h3 { font-size: 21px; margin: 36px 0 12px; }
    .content h4 { font-size: 17px; margin: 28px 0 10px; }
    .content h2, .content h3, .content h4 { position: relative; line-height: 1.3; }
    .anchor { position: absolute; left: -22px; color: var(--dim); opacity: 0; font-weight: 400; }
    .content h2:hover .anchor, .content h3:hover .anchor, .content h4:hover .anchor { opacity: 1; text-decoration: none; }
    .content hr { display: none; }
    .content p, .content li { color: #d6d4cc; }
    .content ul, .content ol { padding-left: 24px; }
    .content li { margin: 4px 0; }
    .content strong { color: var(--text); }
    .content img { max-width: 100%; }
    .content blockquote {
      margin: 20px 0; padding: 12px 18px;
      background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0;
    }
    .content blockquote p { margin: 4px 0; }
    .content :not(pre) > code {
      font: 0.88em var(--mono); background: var(--elevated); border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 4px; color: var(--accent-hi);
    }
    .content pre {
      position: relative; margin: 18px 0; padding: 16px 18px; overflow-x: auto;
      background: #0e0e15; border: 1px solid var(--border); border-radius: 8px;
      font: 13.5px/1.6 var(--mono);
    }
    .content pre code.hljs { background: none; padding: 0; }
    .copy {
      position: absolute; top: 8px; right: 8px;
      font: 12px var(--sans); color: var(--muted); background: var(--elevated);
      border: 1px solid var(--border); border-radius: 5px; padding: 3px 9px; cursor: pointer;
      opacity: 0; transition: opacity 0.15s;
    }
    pre:hover .copy, .copy:focus { opacity: 1; }
    .table-wrap { overflow-x: auto; margin: 18px 0; border: 1px solid var(--border); border-radius: 8px; }
    .content table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
    .content th, .content td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    .content th { background: var(--surface); color: var(--text); font-weight: 600; }
    .content tr:last-child td { border-bottom: 0; }

    .footer { text-align: center; color: var(--dim); font-size: 13px; padding: 32px 24px; border-top: 1px solid var(--border); }

    /* ── Mobile ───────────────────────────────────────── */
    @media (max-width: 900px) {
      .nav { display: none; }
      .menu-btn { display: block; }
      .layout { grid-template-columns: minmax(0, 1fr); }
      .toc {
        display: none; position: fixed; top: var(--header-h); left: 0; right: 0; z-index: 15;
        height: calc(100vh - var(--header-h)); background: var(--bg); border-right: 0; padding: 20px 16px;
      }
      body.menu-open .toc { display: block; }
      .toc .mobile-links { display: flex; gap: 16px; margin: 0 0 18px 10px; }
      .content { padding: 28px 16px 72px; }
      .hero { padding: 48px 16px 40px; }
      .hero h1 { font-size: 32px; }
      .hero p { font-size: 17px; }
      .anchor { display: none; }
    }
    @media (min-width: 901px) { .toc .mobile-links { display: none; } }

    {{HLJS_CSS}}
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="./">
      <img src="favicon.svg" alt="" />
      MCP Playbook
      <span class="version">v{{VERSION}}</span>
    </a>
    <nav class="nav">
      <a href="#quick-start">Docs</a>
      <a href="{{REPO}}" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.npmjs.com/package/mcp-playbook" target="_blank" rel="noopener">npm</a>
      <a class="cta" href="playground/">Playground →</a>
    </nav>
    <button class="menu-btn" aria-label="Open menu" aria-expanded="false">☰ Menu</button>
  </header>

  <section class="hero">
    <img src="favicon.svg" alt="" />
    <h1>MCP Playbook</h1>
    <p>{{DESCRIPTION}}</p>
    <div class="install"><code>npm install -D mcp-playbook</code></div>
    <div class="buttons">
      <a class="btn primary" href="playground/">Try the playground →</a>
      <a class="btn" href="#quick-start">Read the docs</a>
      <a class="btn" href="{{REPO}}" target="_blank" rel="noopener">★ GitHub</a>
    </div>
  </section>

  <div class="layout">
    <aside class="toc">
      <div class="mobile-links">
        <a href="playground/">Playground →</a>
        <a href="{{REPO}}" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.npmjs.com/package/mcp-playbook" target="_blank" rel="noopener">npm</a>
      </div>
      <p class="toc-title">On this page</p>
      {{TOC}}
    </aside>
    <main class="content">
      {{CONTENT}}
    </main>
  </div>

  <footer class="footer">
    MIT licensed · <a href="{{REPO}}" target="_blank" rel="noopener">GitHub</a> ·
    <a href="https://www.npmjs.com/package/mcp-playbook" target="_blank" rel="noopener">npm</a>
  </footer>

  <script>
    // Copy buttons on code blocks
    document.querySelectorAll('.content pre').forEach(pre => {
      const btn = document.createElement('button')
      btn.className = 'copy'
      btn.textContent = 'Copy'
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(pre.querySelector('code').innerText)
          btn.textContent = 'Copied!'
        } catch { btn.textContent = 'Press ⌘/Ctrl+C' }
        setTimeout(() => { btn.textContent = 'Copy' }, 1500)
      })
      pre.appendChild(btn)
    })

    // Mobile menu
    const menuBtn = document.querySelector('.menu-btn')
    menuBtn.addEventListener('click', () => {
      const open = document.body.classList.toggle('menu-open')
      menuBtn.setAttribute('aria-expanded', String(open))
    })
    document.querySelectorAll('.toc a').forEach(a => a.addEventListener('click', () => {
      document.body.classList.remove('menu-open')
      menuBtn.setAttribute('aria-expanded', 'false')
    }))

    // Highlight the section currently in view
    const links = new Map([...document.querySelectorAll('.toc a[href^="#"]')].map(a => [a.getAttribute('href').slice(1), a]))
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return
        links.forEach(a => a.classList.remove('active'))
        links.get(entry.target.id)?.classList.add('active')
      })
    }, { rootMargin: '-70px 0px -70% 0px' })
    document.querySelectorAll('.content h2[id], .content h3[id]').forEach(h => observer.observe(h))
  </script>
</body>
</html>
